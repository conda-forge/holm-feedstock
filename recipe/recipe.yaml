schema_version: 1

context:
  version: "0.11.0"
  python_min: "3.11"

package:
  name: holm
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/h/holm/holm-${{ version }}.tar.gz
    sha256: cee008576dca1c6bbf74ad319334872447f7626efe71cf3d5d9028401336c0f8

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }}
    - fastapi >=0.135.0
    - fasthx >=3.2.2
    - htmy >=0.13.1
    - jinja2 >=3.1.6
    - markupsafe >=3.0.3
    - lxml >=6.0.0
    - python-multipart >=0.0.20

tests:
  - python:
      imports:
        - holm
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/volfpeter/holm
  summary: Web development framework that brings the Next.js developer experience to Python, built on FastAPI, htmy, and FastHX.

extra:
  recipe-maintainers:
    - davidbrochart
